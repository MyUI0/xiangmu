<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker容器管理平台</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Docker容器管理平台</h1>
            <div class="header-actions">
                <button id="refreshBtn" class="btn btn-secondary">刷新</button>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="containers">容器管理</button>
            <button class="tab" data-tab="images">镜像管理</button>
            <button class="tab" data-tab="system">系统信息</button>
        </nav>

        <main>
            <section id="containers-tab" class="tab-content active">
                <div class="section-header">
                    <h2>容器列表</h2>
                    <div class="actions">
                        <button id="createContainerBtn" class="btn btn-primary">创建容器</button>
                    </div>
                </div>
                <div id="containers-list" class="grid-container"></div>
            </section>

            <section id="images-tab" class="tab-content">
                <div class="section-header">
                    <h2>镜像列表</h2>
                </div>
                <div id="images-list" class="grid-container"></div>
            </section>

            <section id="system-tab" class="tab-content">
                <h2>系统信息</h2>
                <div id="system-info" class="info-panel"></div>
            </section>
        </main>
    </div>

    <!-- 创建容器弹窗 -->
    <div id="createContainerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>创建新容器</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="imageName">镜像名称</label>
                    <input type="text" id="imageName" placeholder="例如: nginx:latest">
                </div>
                <div class="form-group">
                    <label for="containerName">容器名称</label>
                    <input type="text" id="containerName" placeholder="可选">
                </div>
                <div class="form-group">
                    <label for="portMapping">端口映射</label>
                    <input type="text" id="portMapping" placeholder="例如: 8080:80">
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancelBtn" class="btn btn-secondary">取消</button>
                <button id="confirmCreateBtn" class="btn btn-primary">创建</button>
            </div>
        </div>
    </div>

    <!-- 容器详情弹窗 -->
    <div id="containerDetailModal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3>容器详情</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <pre id="containerDetailContent"></pre>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志分析平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 日志分析平台</h1>
            <nav>
                <button class="nav-btn active" data-tab="dashboard">仪表盘</button>
                <button class="nav-btn" data-tab="logs">日志管理</button>
                <button class="nav-btn" data-tab="alerts">告警中心</button>
                <button class="nav-btn" data-tab="rules">规则管理</button>
            </nav>
        </header>

        <main>
            <!-- 仪表盘 -->
            <section id="dashboard" class="tab-content active">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="total-files">0</div>
                        <div class="stat-label">日志文件</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="active-alerts">0</div>
                        <div class="stat-label">活跃告警</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="recent-analyses">0</div>
                        <div class="stat-label">最近分析</div>
                    </div>
                </div>

                <div class="grid">
                    <div class="card">
                        <h2>最新告警</h2>
                        <div id="alerts-list" class="list"></div>
                    </div>
                    <div class="card">
                        <h2>日志文件</h2>
                        <div id="files-list" class="list"></div>
                    </div>
                </div>
            </section>

            <!-- 日志管理 -->
            <section id="logs" class="tab-content">
                <div class="card">
                    <h2>上传日志文件</h2>
                    <div class="upload-area" id="upload-area">
                        <input type="file" id="file-input" accept=".log,.txt,.out">
                        <div class="upload-text">
                            <p>📁 拖拽文件到此处或点击上传</p>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2>日志文件列表</h2>
                    <div id="log-files-table"></div>
                </div>

                <div class="card" id="log-viewer" style="display: none;">
                    <div class="card-header">
                        <h2>日志查看器</h2>
                        <div>
                            <input type="text" id="search-input" placeholder="搜索日志...">
                            <button class="btn" id="search-btn">搜索</button>
                            <button class="btn" id="close-viewer">关闭</button>
                        </div>
                    </div>
                    <div id="log-content"></div>
                </div>

                <div class="card" id="analysis-result" style="display: none;">
                    <h2>分析结果</h2>
                    <div id="analysis-data"></div>
                </div>
            </section>

            <!-- 告警中心 -->
            <section id="alerts" class="tab-content">
                <div class="card">
                    <div class="card-header">
                        <h2>告警列表</h2>
                        <div>
                            <label><input type="checkbox" id="show-resolved"> 显示已解决</label>
                        </div>
                    </div>
                    <div id="alerts-table"></div>
                </div>
            </section>

            <!-- 规则管理 -->
            <section id="rules" class="tab-content">
                <div class="card">
                    <div class="card-header">
                        <h2>告警规则</h2>
                        <button class="btn" id="add-rule-btn">添加规则</button>
                    </div>
                    <div id="rules-table"></div>
                </div>

                <div class="card" id="add-rule-form" style="display: none;">
                    <h2>添加告警规则</h2>
                    <form id="rule-form">
                        <div class="form-group">
                            <label>规则名称</label>
                            <input type="text" id="rule-name" required>
                        </div>
                        <div class="form-group">
                            <label>匹配模式（正则表达式）</label>
                            <input type="text" id="rule-pattern" required>
                        </div>
                        <div class="form-group">
                            <label>严重级别</label>
                            <select id="rule-severity">
                                <option value="info">信息</option>
                                <option value="warning" selected>警告</option>
                                <option value="error">错误</option>
                                <option value="critical">严重</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>描述</label>
                            <textarea id="rule-description" rows="3"></textarea>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">保存</button>
                            <button type="button" class="btn" id="cancel-rule">取消</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/static/js/main.js"></script>
</body>
</html>

name: Deploy All Projects to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install corepack
        run: corepack enable

      # ========== 修复 blog-dashboard 类型定义（必须在 Tailwind 修复之前）==========
      - name: Fix blog-dashboard types
        run: |
          echo "🔧 修复 blog-dashboard 类型定义..."
          
          TYPES_FILE="web-frontend/blog-dashboard/frontend/src/types/index.ts"
          
          # 直接创建完整的类型定义文件
          cat > "$TYPES_FILE" << 'TYPESEOF'
          export interface Article {
            id: string;
            title: string;
            content: string;
            category: string;
            status: 'draft' | 'published';
            createdAt: string;
            updatedAt: string;
            views: number;
            likes: number;
          }

          export interface Statistics {
            totalArticles: number;
            publishedArticles: number;
            draftArticles: number;
            totalViews: number;
            totalLikes: number;
          }

          export interface TrendData {
            date: string;
            views: number;
            likes: number;
          }

          export interface CategoryData {
            name: string;
            count: number;
          }

          export interface User {
            id: string;
            username: string;
            avatar: string;
          }

          export interface Notification {
            id: string;
            title: string;
            message: string;
            read: boolean;
            createdAt: string;
          }
          TYPESEOF
          
          echo "✅ blog-dashboard 类型定义已更新！"
          cat "$TYPES_FILE"

      # ========== 修复 Tailwind CSS 配置 ==========
      - name: Fix Tailwind CSS Configuration
        run: |
          echo "🔧 修复 Tailwind CSS 配置..."
          
          PROJECTS=(
            "ai-projects/qa-interface"
            "ai-projects/recommendation-interface"
            "ai-projects/image-recognition"
            "ai-projects/speech-synthesis"
            "data-visualization/dashboard"
            "data-visualization/real-time-monitor"
            "ui-libs/react-components"
            "ui-libs/vue-components"
            "web-frontend/blog-dashboard/frontend"
            "web-frontend/e-commerce"
            "web-frontend/weather-app"
            "web-frontend/task-manager"
            "games/2048-game"
            "desktop-apps/electron-notepad"
          )
          
          for project in "${PROJECTS[@]}"; do
            if [ -d "$project" ]; then
              echo "📁 处理项目: $project"
              
              if [ -f "$project/package.json" ]; then
                sed -i 's/"tailwindcss": "\^4\.0\.0"/"tailwindcss": "^3.4.0"/g' "$project/package.json"
                sed -i 's/"tailwindcss": "\^4\.[0-9]\+\.[0-9]\+"/"tailwindcss": "^3.4.0"/g' "$project/package.json"
                echo "  ✓ 更新 package.json"
              fi
              
              if [ -f "$project/package-lock.json" ]; then
                rm "$project/package-lock.json"
                echo "  ✓ 删除旧 package-lock.json"
              fi
              if [ -d "$project/node_modules" ]; then
                rm -rf "$project/node_modules"
                echo "  ✓ 删除 node_modules"
              fi
              
              if [ ! -f "$project/tailwind.config.js" ] && [ -f "$project/package.json" ]; then
                cat > "$project/tailwind.config.js" << 'TAILWINDEOF'
          /** @type {import('tailwindcss').Config} */
          export default {
            content: [
              "./index.html",
              "./src/**/*.{js,ts,jsx,tsx}",
            ],
            theme: {
              extend: {},
            },
            plugins: [],
          }
          TAILWINDEOF
                echo "  ✓ 创建 tailwind.config.js"
              fi
              
              if [ -f "$project/src/index.css" ]; then
                if grep -q '@import "tailwindcss"' "$project/src/index.css"; then
                  cat > "$project/src/index.css" << 'CSSEOF'
          @tailwind base;
          @tailwind components;
          @tailwind utilities;

          body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          }
          CSSEOF
                  echo "  ✓ 更新 src/index.css"
                fi
              fi
              
              if [ -f "$project/postcss.config.js" ]; then
                cat > "$project/postcss.config.js" << 'POSTCSSEOF'
          export default {
            plugins: {
              tailwindcss: {},
              autoprefixer: {},
            },
          }
          POSTCSSEOF
                echo "  ✓ 更新 postcss.config.js"
              fi
            fi
          done
          
          echo "✅ Tailwind CSS 配置修复完成！"

      # ========== 构建首页 ==========
      - name: Build homepage
        run: |
          mkdir -p dist
          cp docs/index.html dist/index.html

      # ========== 构建 React/Vue 项目 ==========
      - name: Build speech-synthesis
        working-directory: ai-projects/speech-synthesis
        run: |
          npm install
          npx vite build --base /projects/speech-synthesis/
          mkdir -p $GITHUB_WORKSPACE/dist/projects/speech-synthesis
          cp -r dist/* $GITHUB_WORKSPACE/dist/projects/speech-synthesis/

      - name: Build image-recognition
        working-directory: ai-projects/image-recognition
        run: |
          npm install
          npx vite build --base /projects/image-recognition/
          mkdir -p $GITHUB_WORKSPACE/dist/projects/image-recognition
          cp -r dist/* $GITHUB_WORKSPACE/dist/projects/image-recognition/

      - name: Build qa-interface
        working-directory: ai-projects/qa-interface
        run: |
          npm install
          npx vite build --base /projects/qa-interface/
          mkdir -p $GITHUB_WORKSPACE/dist/projects/qa-interface
          cp -r dist/* $GITHUB_WORKSPACE/dist/projects/qa-interface/

      - name: Build recommendation-interface
        working-directory: ai-projects/recommendation-interface
        run: |
          npm install
          npx vite build --base /projects/recommendation-interface/
          mkdir -p $GITHUB_WORKSPACE/dist/projects/recommendation-interface
          cp -r dist/* $GITHUB_WORKSPACE/dist/projects/recommendation-interface/

      - name: Build dashboard
        working-directory: data-visualization/dashboard
        run: |
          npm install
          npx vite build --base /projects/dashboard/
          mkdir -p $GITHUB_WORKSPACE/dist/projects/dashboard
          cp -r dist/* $GITHUB_WORKSPACE/dist/projects/dashboard/

      - name: Build real-time-monitor
        working-directory: data-visualization/real-time-monitor
        run: |
          npm install
          npx vite build --base /projects/real-time-monitor/
          mkdir -p $GITHUB_WORKSPACE/dist/projects/real-time-monitor
          cp -r dist/* $GITHUB_WORKSPACE/dist/projects/real-time-monitor/

      - name: Build react-components
        working-directory: ui-libs/react-components
        run: |
          npm install
          npx vite build --base /projects/react-components/
          mkdir -p $GITHUB_WORKSPACE/dist/projects/react-components
          cp -r dist/* $GITHUB_WORKSPACE/dist/projects/react-components/

      - name: Build vue-components
        working-directory: ui-libs/vue-components
        run: |
          rm -f pnpm-lock.yaml
          rm -rf node_modules
          pnpm install
          npx vite build --base /projects/vue-components/
          mkdir -p $GITHUB_WORKSPACE/dist/projects/vue-components
          cp -r dist/* $GITHUB_WORKSPACE/dist/projects/vue-components/

      - name: Build blog-dashboard
        working-directory: web-frontend/blog-dashboard/frontend
        run: |
          npm install
          npx vite build --base /projects/blog-dashboard/
          mkdir -p $GITHUB_WORKSPACE/dist/projects/blog-dashboard
          cp -r dist/* $GITHUB_WORKSPACE/dist/projects/blog-dashboard/

      - name: Build e-commerce
        working-directory: web-frontend/e-commerce
        run: |
          npm install
          npx vite build --base /projects/e-commerce/
          mkdir -p $GITHUB_WORKSPACE/dist/projects/e-commerce
          cp -r dist/* $GITHUB_WORKSPACE/dist/projects/e-commerce/

      - name: Build weather-app
        working-directory: web-frontend/weather-app
        run: |
          rm -f pnpm-lock.yaml
          rm -rf node_modules
          pnpm install
          npx vite build --base /projects/weather-app/
          mkdir -p $GITHUB_WORKSPACE/dist/projects/weather-app
          cp -r dist/* $GITHUB_WORKSPACE/dist/projects/weather-app/

      - name: Build task-manager
        working-directory: web-frontend/task-manager
        run: |
          npm install
          npx vite build --base /projects/task-manager/
          mkdir -p $GITHUB_WORKSPACE/dist/projects/task-manager
          cp -r dist/* $GITHUB_WORKSPACE/dist/projects/task-manager/

      - name: Build 2048-game
        working-directory: games/2048-game
        run: |
          npm install
          npx vite build --base /projects/2048-game/
          mkdir -p $GITHUB_WORKSPACE/dist/projects/2048-game
          cp -r dist/* $GITHUB_WORKSPACE/dist/projects/2048-game/

      - name: Build electron-notepad
        working-directory: desktop-apps/electron-notepad
        run: |
          npm install
          npx vite build --base /projects/notepad/
          mkdir -p $GITHUB_WORKSPACE/dist/projects/notepad
          cp -r dist/* $GITHUB_WORKSPACE/dist/projects/notepad/

      # ========== 复制纯静态项目 ==========
      - name: Copy portfolio
        run: |
          mkdir -p dist/projects/portfolio
          cp -r web-frontend/portfolio/* dist/projects/portfolio/

      - name: Copy pretext-demo
        run: |
          mkdir -p dist/projects/pretext-demo
          cp -r web-frontend/pretext-demo/* dist/projects/pretext-demo/

      - name: Copy snake-game
        run: |
          mkdir -p dist/projects/snake-game
          cp -r games/snake-game/* dist/projects/snake-game/

      - name: Copy docker-manager-frontend
        run: |
          mkdir -p dist/projects/docker-manager
          cp -r linux-ops/docker-manager/frontend/* dist/projects/docker-manager/

      # ========== 上传 Pages 制品 ==========
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

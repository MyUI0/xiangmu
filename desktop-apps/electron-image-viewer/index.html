<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>图片查看器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
      height: 100vh;
      overflow: hidden;
      background-color: #1e1e1e;
      color: #fff;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* 顶部工具栏 */
    .toolbar {
      background-color: #2d2d2d;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid #404040;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      background-color: #404040;
      color: #fff;
    }

    .btn:hover {
      background-color: #505050;
    }

    .btn-primary {
      background-color: #007acc;
    }

    .btn-primary:hover {
      background-color: #0066aa;
    }

    /* 主内容区 */
    .main-content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* 左侧缩略图 */
    .sidebar {
      width: 200px;
      background-color: #252526;
      border-right: 1px solid #404040;
      overflow-y: auto;
      padding: 10px;
    }

    .thumbnail-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .thumbnail {
      width: 100%;
      aspect-ratio: 4/3;
      border: 2px solid transparent;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
    }

    .thumbnail:hover {
      border-color: #007acc;
    }

    .thumbnail.active {
      border-color: #007acc;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 图片显示区 */
    .image-viewer {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1e1e1e;
      overflow: hidden;
      position: relative;
    }

    .image-container {
      position: relative;
      max-width: 90%;
      max-height: 90%;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    #imageCanvas {
      max-width: 100%;
      max-height: 80vh;
      display: block;
    }

    /* 右侧编辑面板 */
    .edit-panel {
      width: 280px;
      background-color: #252526;
      border-left: 1px solid #404040;
      padding: 20px;
      overflow-y: auto;
    }

    .panel-title {
      font-size: 18px;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #404040;
    }

    .edit-section {
      margin-bottom: 25px;
    }

    .edit-section h3 {
      font-size: 14px;
      margin-bottom: 12px;
      color: #cccccc;
    }

    .slider-control {
      margin-bottom: 15px;
    }

    .slider-control label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      font-size: 13px;
    }

    .slider-control input[type="range"] {
      width: 100%;
      -webkit-appearance: none;
      height: 6px;
      background: #404040;
      border-radius: 3px;
      outline: none;
    }

    .slider-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #007acc;
      border-radius: 50%;
      cursor: pointer;
    }

    .color-control {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .color-control input[type="color"] {
      width: 50px;
      height: 30px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-group .btn {
      flex: 1;
    }

    .empty-state {
      text-align: center;
      color: #666;
    }

    .empty-state h2 {
      margin-bottom: 15px;
    }

    .zoom-controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: rgba(45, 45, 45, 0.9);
      padding: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 工具栏 -->
    <div class="toolbar">
      <button class="btn btn-primary" id="openBtn">打开图片</button>
      <button class="btn" id="saveBtn">保存图片</button>
      <button class="btn" id="resetBtn">重置图片</button>
      <div style="flex: 1;"></div>
      <span id="fileName" style="color: #aaa; font-size: 14px;"></span>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
      <!-- 左侧缩略图 -->
      <div class="sidebar">
        <div class="thumbnail-list" id="thumbnailList">
          <div class="empty-state" style="margin-top: 50px;">
            <p>暂无图片</p>
          </div>
        </div>
      </div>

      <!-- 图片显示区 -->
      <div class="image-viewer" id="imageViewer">
        <div class="empty-state" id="emptyState">
          <h2>请选择图片进行查看和编辑</h2>
          <p>点击"打开图片"按钮开始</p>
        </div>
        <div class="image-container" id="imageContainer" style="display: none;">
          <canvas id="imageCanvas"></canvas>
        </div>
        <div class="zoom-controls" id="zoomControls" style="display: none;">
          <button class="btn" id="zoomOutBtn">-</button>
          <span id="zoomLevel">100%</span>
          <button class="btn" id="zoomInBtn">+</button>
          <button class="btn" id="rotateLeftBtn">↶</button>
          <button class="btn" id="rotateRightBtn">↷</button>
        </div>
      </div>

      <!-- 右侧编辑面板 -->
      <div class="edit-panel">
        <div class="panel-title">图片编辑</div>

        <div class="edit-section">
          <h3>调整</h3>
          <div class="slider-control">
            <label>
              <span>亮度</span>
              <span id="brightnessValue">0</span>
            </label>
            <input type="range" id="brightness" min="-100" max="100" value="0">
          </div>
          <div class="slider-control">
            <label>
              <span>对比度</span>
              <span id="contrastValue">0</span>
            </label>
            <input type="range" id="contrast" min="-100" max="100" value="0">
          </div>
          <div class="slider-control">
            <label>
              <span>饱和度</span>
              <span id="saturationValue">0</span>
            </label>
            <input type="range" id="saturation" min="-100" max="100" value="0">
          </div>
        </div>

        <div class="edit-section">
          <h3>滤镜</h3>
          <div class="btn-group">
            <button class="btn" id="grayscaleBtn">黑白</button>
            <button class="btn" id="invertBtn">反相</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
